name: Clone full Adsela website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-adselams
  cancel-in-progress: false

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover sitemap URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request, xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          DOMAIN = 'adselams.com'
          seeds = [
              'https://adselams.com/wp-sitemap.xml',
              'https://adselams.com/sitemap_index.xml',
              'https://adselams.com/sitemap.xml',
          ]
          seen = set()
          urls = {'https://adselams.com/'}

          def same_site(url):
              host = (urlparse(url).hostname or '').lower()
              return host in {DOMAIN, 'www.' + DOMAIN}

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          def walk(url):
              if url in seen:
                  return
              seen.add(url)
              try:
                  root = ET.fromstring(fetch(url))
              except Exception:
                  return
              locs = [e.text.strip() for e in root.iter() if e.tag.lower().endswith('loc') and e.text]
              is_index = root.tag.lower().endswith('sitemapindex')
              for loc in locs:
                  if not same_site(loc):
                      continue
                  if is_index:
                      walk(loc)
                  else:
                      urls.add(loc)

          try:
              robots = fetch('https://adselams.com/robots.txt').decode('utf-8','ignore')
              for m in re.finditer(r'(?im)^\s*Sitemap:\s*(\S+)', robots):
                  if same_site(m.group(1)):
                      seeds.append(m.group(1))
          except Exception:
              pass

          for s in seeds:
              walk(s)

          with open('/tmp/adselams-urls.txt','w',encoding='utf-8') as f:
              f.write('\n'.join(sorted(urls)) + '\n')
          print('Discovered URLs:', len(urls))
          PY

      - name: Mirror website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/site
          mkdir -p /tmp/site

          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --execute robots=off \
            --user-agent='Mozilla/5.0 (compatible; AdselaStaticMirror/1.0)' \
            --domains=adselams.com,www.adselams.com \
            --reject-regex='(/wp-admin/|/wp-login\.php|/xmlrpc\.php|/trackback/?$|[?&]replytocom=)' \
            --directory-prefix=/tmp/site \
            'https://adselams.com/' || true

          wget \
            --input-file=/tmp/adselams-urls.txt \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-host-directories \
            --execute robots=off \
            --user-agent='Mozilla/5.0 (compatible; AdselaStaticMirror/1.0)' \
            --domains=adselams.com,www.adselams.com \
            --directory-prefix=/tmp/site || true

          test -f /tmp/site/index.html
          echo "Files: $(find /tmp/site -type f | wc -l)"
          echo "HTML: $(find /tmp/site -type f -name '*.html' | wc -l)"

      - name: Replace repository content with fresh mirror
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/site/ ./
          touch .nojekyll

      - name: Commit fresh mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No website changes found.'
            exit 0
          fi
          git commit -m 'Publish full Adsela website mirror'
          git push origin HEAD:main
